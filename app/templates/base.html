<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover lets the page use the full iPad screen edge-to-edge -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kitchen Pantry</title>

    <!-- PWA: lets the iPad "Add to Home Screen" and run fullscreen,
         kiosk-style, with no Safari chrome. No service worker — over
         plain HTTP on the LAN that's not a secure context, so one would
         never register; the app needs the server for all data anyway. -->
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#e0653a">
    <!-- iPadOS standalone is driven by these Apple-specific tags, not the
         manifest's display mode. The header is light now, so use the default
         (dark text) status bar — black-translucent would render dark text
         that vanishes against the light header. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pantry">
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
    <link rel="icon" href="/static/icons/icon-192.png">

    <!-- ?v= cache-buster: bump when styles.css changes so devices that
         cached an older copy (before Cache-Control: no-cache shipped) fetch
         the new one without a manual cache clear. -->
    <link rel="stylesheet" href="/static/css/styles.css?v=2">
    <!-- HTMX is served locally, never from a CDN: the kitchen iPad only
         talks to the LAN and can't reach the internet. -->
    <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="eyebrow"><span class="pip"></span><span>command.home.arpa</span></div>
        <h1>Kitchen Pantry</h1>
        <p class="tagline">What's in the kitchen &amp; what's running low.</p>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
