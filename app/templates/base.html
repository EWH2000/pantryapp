<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover lets the page use the full iPad screen edge-to-edge -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kitchen Pantry</title>

    <!-- PWA: lets the iPad "Add to Home Screen" and run fullscreen,
         kiosk-style, with no Safari chrome. No service worker — over
         plain HTTP on the LAN that's not a secure context, so one would
         never register; the app needs the server for all data anyway. -->
    <link rel="manifest" href="{{ base_path }}/static/manifest.webmanifest">
    <meta name="theme-color" content="#e0653a">
    <!-- iPadOS standalone is driven by these Apple-specific tags, not the
         manifest's display mode. The header is light now, so use the default
         (dark text) status bar — black-translucent would render dark text
         that vanishes against the light header. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pantry">
    <link rel="apple-touch-icon" href="{{ base_path }}/static/icons/icon-180.png">
    <link rel="icon" href="{{ base_path }}/static/icons/icon-192.png">

    <!-- ?v= cache-buster: bump when styles.css changes so devices that
         cached an older copy (before Cache-Control: no-cache shipped) fetch
         the new one without a manual cache clear. -->
    <link rel="stylesheet" href="{{ base_path }}/static/css/styles.css?v=4">
    <!-- HTMX is served locally, never from a CDN: the kitchen iPad only
         talks to the LAN and can't reach the internet. -->
    <script src="{{ base_path }}/static/js/htmx.min.js" defer></script>
    <!-- Barcode scanning. ZXing (vendored, no CDN) loads before scan.js so the
         `ZXing` global exists; scan.js drives the camera overlay. iOS Safari has
         no native BarcodeDetector, so ZXing is the primary decoder there. -->
    <script src="{{ base_path }}/static/js/zxing.min.js" defer></script>
    <script src="{{ base_path }}/static/js/scan.js?v=2" defer></script>
</head>
<!-- data-base-path is the single source of truth for JS-built URLs (scan.js
     can't read Jinja globals); every fetch in scan.js prepends it. -->
<body data-base-path="{{ base_path }}">
    <header class="app-header">
        <a class="home-pill" href="/" aria-label="Back to home dashboard">
            <svg class="home-pill__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9.5 12 3l9 6.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9 21v-6h6v6"/>
            </svg>
            <span>Home</span>
        </a>
        <div class="eyebrow"><span class="pip"></span><span>command.home.arpa</span></div>
        <h1>Kitchen Pantry</h1>
        <p class="tagline">What's in the kitchen &amp; what's running low.</p>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
